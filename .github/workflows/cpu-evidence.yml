name: Saved research evidence (CPU)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-cpu-verify.txt
      - run: python -m pytest tests/cpu_verify -q
      - run: python scripts/verify_cpu_artifacts.py --output reports/cpu-evidence/verification.json
